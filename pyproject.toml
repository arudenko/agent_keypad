[project]
name = "herdr-km16"
version = "0.1.0"
description = "MMD KM16 macropad as a physical control surface for Claude Code agents in Herdr"
requires-python = ">=3.12"
dependencies = [
    "hidapi>=0.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
herdr-km16 = "herdr_km16.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
