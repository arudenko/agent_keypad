# agterm-km16 controller configuration.
# Everything the controller does should be changeable here, without editing source.

agterm:
  session: null            # unused on agterm; kept for config compatibility
  reconnect_seconds: 1
  # Backstop resync. The events.read cursor poll drives the LEDs, so this only has to
  # catch anything it misses (a status set while the socket was down). A `tree` call is
  # one cheap unix-socket round trip, so a short interval is still cheap.
  poll_seconds: 5
  # Sleep between events.read polls when no events are queued (agtermctl uses 250ms).
  event_poll_seconds: 0.25
  # Also bring the agterm app to the macOS foreground when a pad key focuses a session
  # or Next jumps -- the socket alone only moves agterm's internal selection.
  activate_app: true

km16:
  watchdog_ms: 2000        # 0 disables; firmware flashes the layer LED red if we stop pinging
  # Re-send the three LED enable switches this often. 0 disables. A tripped firmware
  # watchdog disables both chains, and it trips when pings stop *arriving* -- Windows
  # Modern Standby suspends USB while we keep running, so watchdog_ms's own gap check
  # cannot see it. Costs three 65-byte writes and no repaint, so keep this on.
  led_reassert_seconds: 5
  brightness: 0.35         # starting level; the right knob adjusts it live
  brightness_step: 0.05    # per detent
  underglow: true
  pulse: true

colors:
  working: "#0066ff"
  blocked: "#ff0000"   # blinks red: needs you now
  done: "#00ff44"
  idle: "#202020"
  unknown: "#ff9900"
  empty: "#000000"

mapping:
  preserve_slots: true
  # Close gaps when a session ends: survivors shift down in order, freed keys go dark.
  # false = fully sticky keys (a closed session just leaves its key dark).
  compact: true
  # Pin an agent to a key by agterm session UUID. Unpinned keys are allocated
  # lowest-free-first and stay put for the life of the agent.
  static: {}
    # 0: "EF084D05-83BB-44BD-AE3B-DD7BD9E8C27D"

# Bottom row = actions instead of agents. These keys act on the SELECTED agent (the one
# you last pressed or cycled to, shown brighter on the pad). Removing entries here hands
# the keys back to agents; with all four bound there are 12 agent slots (keys 0-11).
action_keys:
  12: approve          # send Enter  -- accepts the highlighted prompt option
  13: reject           # send Esc    -- declines
  14: interrupt        # send Ctrl+C -- stops the agent
  15: next_attention   # select the next agent needing attention; sends nothing

action_colors:
  approve: "#00ff44"
  reject: "#ff0000"
  interrupt: "#ff9900"
  next_attention: "#0066ff"

controls:
  key_press: focus_agent   # focus_agent | none

  main_encoder:            # key index 16
    rotate: cycle_attention_agents
    focus_on_turn: true    # focus as the knob lands, no press needed
    press: focus_selected  # redundant with focus_on_turn, but harmless

  left_encoder:            # key index 17
    rotate: cycle_agents
    press: escape

  right_encoder:           # key index 18
    rotate: brightness     # turn to dim/brighten the whole pad (runtime only)
    press: enter

safety:
  # Actions that submit input to an agent need a deliberate long press, so a knocked
  # knob cannot approve a Claude Code permission prompt.
  long_press_ms: 300
  require_long_press_for:
    - approve        # bottom-row approve key
    - enter          # right encoder press
    - interrupt
    # `reject` and `next_attention` stay instant: neither can approve anything.
